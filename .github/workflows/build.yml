name: build-apk

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK (platform-36 + build-tools 37.0.0)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -fsSL -o /tmp/cmd.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmd.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          fi
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;37.0.0" > /dev/null

      - name: Install plugin
        run: pip install -e .

      - name: Scaffold demo project
        run: |
          sanjiu-apk scaffold --out ./app-demo \
            --package com.ci.demo --name "CI演示诗库"

      - name: Build release APK
        run: sanjiu-apk build --dir ./app-demo

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sanjiu-release-apk
          path: app-demo/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Scaffold cognitive-engine web APK
        run: |
          sanjiu-apk scaffold --out ./app-cog \
            --package com.sanjiu.cog --name "三元九维·认知引擎" \
            --project SanjiuCog --mode web \
            --html examples/cognitive-engine/index.html \
            --icon examples/cognitive-engine/icon.png

      - name: Build cognitive-engine APK
        run: sanjiu-apk build --dir ./app-cog

      - name: Upload cognitive-engine APK
        uses: actions/upload-artifact@v4
        with:
          name: cognitive-engine-apk
          path: app-cog/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
