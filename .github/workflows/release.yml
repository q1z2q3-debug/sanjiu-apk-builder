name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK (platform-36 + build-tools 37.0.0)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -fsSL -o /tmp/cmd.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmd.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          fi
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;37.0.0" > /dev/null

      - name: Install plugin
        run: pip install -e .

      - name: Scaffold demo project
        run: |
          sanjiu-apk scaffold --out ./app-demo \
            --package com.ci.demo --name "CI演示诗库"

      - name: Build release APK
        run: sanjiu-apk build --dir ./app-demo

      - name: Create GitHub Release with APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          APK=app-demo/app/build/outputs/apk/release/app-release.apk
          echo "== Release tag: $TAG =="
          gh release create "$TAG" \
            "$APK" \
            --title "Release $TAG" \
            --notes "由 [sanjiu-apk-builder](https://github.com/q1z2q3-debug/sanjiu-apk-builder) 自动构建的三元九维诗词 APK（release 签名，apksigner 校验通过）。" \
            || gh release create "$TAG" --title "Release $TAG" --notes "Release $TAG"
