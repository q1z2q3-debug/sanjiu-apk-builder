[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sanjiu-apk-builder"
version = "0.3.0"
description = "一键生成三元九维诗词分类 APK 的开源脚手架 + 构建器"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = ["Pillow>=9"]
keywords = ["android", "apk", "scaffold", "sanjiu", "triple-nine", "poetry"]

[project.scripts]
sanjiu-apk = "sanjiu_apk.cli:main"

[tool.setuptools]
packages = ["sanjiu_apk"]

[tool.setuptools.package-data]
sanjiu_apk = ["templates/**/*"]
